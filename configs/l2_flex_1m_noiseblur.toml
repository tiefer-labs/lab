# Milestone L2: as l2_flex_1m with sensor noise up to 0.01 reflectance and a mild Gaussian blur up to sigma 1 pixel: a sensor robustness run.
# The values are design choices, not measured sensor properties; the cost on
# Sentinel-2 validation is measured by comparing with l2_flex_1m.
name = "l2_flex_1m_noiseblur"

[data]
cache_name = "cloudsen12-l1c-all"
crop_size = 256
batch_size = 128
eval_batch_size = 8
num_workers = 16
load_mode = "auto"
brightness = 0.1
contrast = 0.1
bands = ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B09", "B10", "B11", "B12"]
rescale_min = 1.0
rescale_max = 1.0
gain_jitter = 0.0
offset_jitter = 0.0
noise_std = 0.01
blur_sigma = 1.0

[model]
widths = [32, 64, 128, 256, 512]
architecture = "separable_unet"
input = "flexible"
flexible_design = "placeholder"

[train]
seed = 0
epochs = 150
learning_rate = 0.008
weight_decay = 0.0001
dice_weight = 1.0
patience = 150
min_improvement = 0.001
log_every = 20
warmup_epochs = 5
ema_decay = 0.999
band_sets = [["B02", "B03", "B04"], ["B02", "B03", "B04", "B08"], ["B02", "B03", "B04", "B08", "B11", "B12"], ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B09", "B10", "B11", "B12"]]
distill_weight = 1.0
class_weighting = "none"
focal_gamma = 0.0

[evaluation]
thresholds = [0.3, 0.5, 0.7]
decision_threshold = 0.5
bootstrap_resamples = 1000
bootstrap_seed = 0

[export]
opset = 17
input_size = 512
calibration_patches = 256
max_logit_difference = 0.01
min_argmax_agreement = 0.999
