# Milestone L2: as l2_flex_1m with per-band gain jitter of up to 10 percent and offset jitter of up to 0.02 reflectance: a sensor robustness run.
# The values are design choices, not measured sensor properties; the cost on
# Sentinel-2 validation is measured by comparing with l2_flex_1m.
name = "l2_flex_1m_gainoffset"

[data]
cache_name = "cloudsen12-l1c-all"
crop_size = 256
# Batch 64 and learning rate 0.004 (0.008 x 64 / 128, the linear scaling of
# l1_base) so that 13 bands fit in the memory of one GH200; confirmed by the
# v2 timing run. Every L2 config uses the same values so that the L2 results
# stay comparable (docs/ASSUMPTIONS.md).
batch_size = 64
eval_batch_size = 8
num_workers = 16
# The whole training split in memory (load_mode "memory"); the l2_flex_1m
# variants keep it so that each changes one setting only.
load_mode = "memory"
brightness = 0.1
contrast = 0.1
bands = ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B09", "B10", "B11", "B12"]
rescale_min = 1.0
rescale_max = 1.0
gain_jitter = 0.1
offset_jitter = 0.02
noise_std = 0.0
blur_sigma = 0.0

[model]
widths = [32, 64, 128, 256, 512]
architecture = "separable_unet"
input = "flexible"
flexible_design = "placeholder"

[train]
seed = 0
epochs = 150
learning_rate = 0.004
weight_decay = 0.0001
dice_weight = 1.0
patience = 150
min_improvement = 0.001
log_every = 20
warmup_epochs = 5
ema_decay = 0.999
band_sets = [["B02", "B03", "B04"], ["B02", "B03", "B04", "B08"], ["B02", "B03", "B04", "B08", "B11", "B12"], ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B09", "B10", "B11", "B12"]]
distill_weight = 1.0
class_weighting = "none"
focal_gamma = 0.0

[evaluation]
thresholds = [0.3, 0.5, 0.7]
decision_threshold = 0.5
bootstrap_resamples = 1000
bootstrap_seed = 0

[export]
opset = 17
input_size = 512
calibration_patches = 256
max_logit_difference = 0.01
min_argmax_agreement = 0.999
