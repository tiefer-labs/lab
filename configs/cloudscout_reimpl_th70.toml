# Reference, not a Tiefer model: the re-implemented CloudScout, step 2 of the
# paper: frame labels at 70 percent cloudy pixels ("TH70"), only the decision
# layers trained, starting from the best.pt of the one finished run whose ID
# starts with cloudscout_reimpl_step1_th30-seed0. It changes frame_label_threshold, train_only
# and init_checkpoint against cloudscout_reimpl_step1_th30, the three settings of the paper's
# second step, and the epochs of a fine-tune; see cloudscout_reimpl_step1_th30.toml.
name = "cloudscout_reimpl_th70"

[data]
cache_name = "cloudsen12-l1c-all"
# The whole 509 x 509 patch (stored as 512 x 512, padding masked) is one frame.
crop_size = 512
batch_size = 32
eval_batch_size = 8
num_workers = 16
load_mode = "auto"
brightness = 0.1
contrast = 0.1
bands = ["B01", "B02", "B08"]

[model]
# The paper gives no filter numbers; these widths are a design choice
# (docs/ASSUMPTIONS.md, section 6): about 0.63 M parameters.
widths = [16, 32, 64, 128, 128]
architecture = "cloudscout"
input = "fixed"

[train]
seed = 0
epochs = 20
learning_rate = 0.01
weight_decay = 0.0001
patience = 20
min_improvement = 0.001
log_every = 20
warmup_epochs = 1
ema_decay = 0.0
class_weighting = "none"
task = "frame"
frame_label_threshold = 0.7
false_positive_weight = 2.0
train_only = "decision"
init_checkpoint = "cloudscout_reimpl_step1_th30-seed0"

[evaluation]
thresholds = [0.3, 0.5, 0.7]
decision_threshold = 0.5
bootstrap_resamples = 1000
bootstrap_seed = 0

[export]
opset = 17
input_size = 512
calibration_patches = 256
max_logit_difference = 0.01
min_argmax_agreement = 0.999
