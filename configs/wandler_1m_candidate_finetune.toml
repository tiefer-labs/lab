# Fine-tune stage of the L2 candidate reference: starts from the best.pt of the one finished run
# whose ID starts with wandler_1m_candidate-seed0 and trains on whole 512 x 512 patches, so that the
# cloud fraction of a crop is that of the frame the decision sees, with the frame term
# (FRM-01, ACC-07). A stage, not a one-change variant: docs/ASSUMPTIONS.md, section 6.
name = "wandler_1m_candidate_finetune"

[data]
cache_name = "cloudsen12-l1c-all"
crop_size = 512
# Batch 16 at crop 512: as many pixels per batch as batch 64 at crop 256 in the
# other L2 configs (16 x 512 x 512 = 64 x 256 x 256); the learning rate of this
# fine-tune stage is in [train] (docs/ASSUMPTIONS.md, section 6). The values were
# set before Project Schatten and are confirmed or changed by a Project Schatten
# timing run.
batch_size = 16
eval_batch_size = 8
num_workers = 16
# The whole training split in memory (load_mode "memory"); the wandler_1m
# variants keep it so that each changes one setting only.
load_mode = "memory"
brightness = 0.1
contrast = 0.1
bands = ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B09", "B10", "B11", "B12"]
rescale_min = 0.5
rescale_max = 2.0

[model]
widths = [32, 64, 128, 256, 512]
architecture = "separable_unet"
input = "flexible"
flexible_design = "placeholder"

[train]
seed = 0
epochs = 20
learning_rate = 0.0004
weight_decay = 0.0001
dice_weight = 1.0
patience = 20
min_improvement = 0.001
log_every = 20
warmup_epochs = 1
ema_decay = 0.999
band_sets = [["B02", "B03", "B04"], ["B02", "B03", "B04", "B08"], ["B02", "B03", "B04", "B08", "B11", "B12"], ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B8A", "B09", "B10", "B11", "B12"]]
distill_weight = 1.0
class_weighting = "none"
focal_gamma = 0.0
grad_clip_norm = 1.0
skip_nonfinite = true
frame_loss_weight = 0.5
init_checkpoint = "wandler_1m_candidate-seed0"

[evaluation]
thresholds = [0.3, 0.5, 0.7]
decision_threshold = 0.5
bootstrap_resamples = 1000
bootstrap_seed = 0

[export]
opset = 17
input_size = 512
calibration_patches = 256
max_logit_difference = 0.01
min_argmax_agreement = 0.999
