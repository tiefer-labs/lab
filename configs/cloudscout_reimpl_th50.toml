# Reference, not a Tiefer model: as cloudscout_reimpl_th70, with frame labels at this
# repository's decision threshold of 50 percent instead of the paper's 70 percent.
# One change against cloudscout_reimpl_th70: frame_label_threshold.
name = "cloudscout_reimpl_th50"

[data]
cache_name = "cloudsen12-l1c-all"
# The whole 509 x 509 patch (stored as 512 x 512, padding masked) is one frame.
crop_size = 512
batch_size = 32
eval_batch_size = 8
num_workers = 16
load_mode = "auto"
brightness = 0.1
contrast = 0.1
bands = ["B01", "B02", "B08"]

[model]
# The paper gives no filter numbers; these widths are a design choice
# (docs/ASSUMPTIONS.md, section 6): about 0.63 M parameters.
widths = [16, 32, 64, 128, 128]
architecture = "cloudscout"
input = "fixed"

[train]
seed = 0
epochs = 20
learning_rate = 0.01
weight_decay = 0.0001
patience = 20
min_improvement = 0.001
log_every = 20
warmup_epochs = 1
ema_decay = 0.0
class_weighting = "none"
task = "frame"
frame_label_threshold = 0.5
false_positive_weight = 2.0
train_only = "decision"
init_checkpoint = "cloudscout_reimpl_step1_th30-seed0"

[evaluation]
thresholds = [0.3, 0.5, 0.7]
decision_threshold = 0.5
bootstrap_resamples = 1000
bootstrap_seed = 0

[export]
opset = 17
input_size = 512
calibration_patches = 256
max_logit_difference = 0.01
min_argmax_agreement = 0.999
