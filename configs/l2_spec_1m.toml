# Milestone L2: specialist on blue, green, red and near infrared, about 1 M parameters: the control.
# The settings shared by the L2 family, and how they differ from L1, are listed in
# docs/ASSUMPTIONS.md, section 6.
# Bands: B02 B03 B04 B08 (blue, green, red, near infrared), a fixed input; this
# config has no band sets (train.band_sets is empty).
name = "l2_spec_1m"

[data]
cache_name = "cloudsen12-l1c-all"
crop_size = 256
# Batch 64 as l2_spec_1m ran on 3 October 2026 (job 2001425), after batch 128
# ran out of GPU memory with 13 bands for l2_flex_1m (jobs 2000912 and
# 2000941). The learning rate 0.004 (0.008 x 64 / 128) is to be confirmed from
# the run's config.toml. Every L2 config uses the same values so that the L2
# results stay comparable (docs/ASSUMPTIONS.md).
batch_size = 64
eval_batch_size = 8
num_workers = 16
load_mode = "auto"
brightness = 0.1
contrast = 0.1
bands = ["B02", "B03", "B04", "B08"]

[model]
widths = [32, 64, 128, 256, 512]
architecture = "separable_unet"
input = "fixed"
flexible_design = "placeholder"

[train]
seed = 0
epochs = 150
learning_rate = 0.004
weight_decay = 0.0001
dice_weight = 1.0
patience = 150
min_improvement = 0.001
log_every = 20
warmup_epochs = 5
ema_decay = 0.999
band_sets = []
distill_weight = 0.0
class_weighting = "none"
focal_gamma = 0.0

[evaluation]
thresholds = [0.3, 0.5, 0.7]
decision_threshold = 0.5
bootstrap_resamples = 1000
bootstrap_seed = 0

[export]
opset = 17
input_size = 512
calibration_patches = 256
max_logit_difference = 0.01
min_argmax_agreement = 0.999
