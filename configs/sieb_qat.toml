# Quantisation-aware fine-tuning of the Sieb candidate (tiefer_lab.models.qat): starts from
# the best.pt of the one finished run whose ID starts with sieb-seed0, folds batch norm and
# trains with every convolution quantised to INT8 on the fly; its export writes the INT8 file
# from this model instead of post-training quantisation. Optional queue item 20 of
# hpc/roihu/plan.md: it runs only if the Sieb INT8 cloud BOA loss misses CMP-03 after the
# export options. If the Sieb candidate is sieb_candidate, init_checkpoint is changed to it
# in its own commit before the run. A stage, not a one-change variant: qat,
# init_checkpoint, epochs, learning_rate, patience and warmup_epochs differ from sieb
# (docs/ASSUMPTIONS.md, section 6). The fine-tuning values are a design choice, confirmed
# or changed at the gate with the timing report.
name = "sieb_qat"

[data]
cache_name = "cloudsen12-l1c-high"
crop_size = 256
# 128 patches per step; the learning rate is scaled linearly with the batch
# size from 0.002 at 32 (0.002 x 128 / 32 = 0.008).
batch_size = 128
eval_batch_size = 8
# Outside Slurm; inside a job the workers follow SLURM_CPUS_PER_TASK.
num_workers = 16
load_mode = "auto"
brightness = 0.1
contrast = 0.1

[model]
widths = [16, 32, 64, 128, 256]

[train]
seed = 0
epochs = 10
# One tenth of the learning rate of sieb: a fine-tune of trained weights.
learning_rate = 0.0008
weight_decay = 0.0001
dice_weight = 1.0
# Patience equal to the number of epochs, as in sieb.
patience = 10
min_improvement = 0.001
log_every = 20
# No warm-up: the weights are trained already.
warmup_epochs = 0
# Averaging horizon of about 1 / (1 - 0.999) = 1000 steps.
ema_decay = 0.999
init_checkpoint = "sieb-seed0"
qat = true

[evaluation]
thresholds = [0.3, 0.5, 0.7]
decision_threshold = 0.5
bootstrap_resamples = 1000
bootstrap_seed = 0

[export]
opset = 17
input_size = 512
calibration_patches = 256
max_logit_difference = 0.01
min_argmax_agreement = 0.999
