# Every label that the issue forms in .github/ISSUE_TEMPLATE/ apply.
# A label that does not exist in the repository is not applied by GitHub;
# create each one with:
#   gh label create <name> --color <color> --description <description> --force
- name: "bug"
  color: "d73a4a"
  description: "Code or scripts do not work as documented"
- name: "results"
  color: "5319e7"
  description: "A number, interval or source in the documentation"
- name: "reproducibility"
  color: "6f42c1"
  description: "A published result could not be reproduced"
- name: "documentation"
  color: "0075ca"
  description: "A Markdown document is wrong, outdated or unclear"
- name: "claims"
  color: "b60205"
  description: "A public statement and its evidence in CLAIMS.md"
- name: "data"
  color: "0e8a16"
  description: "A dataset, label, cache or download"
- name: "hpc"
  color: "1d76db"
  description: "CSC Roihu or other HPC job scripts"
- name: "export"
  color: "c5def5"
  description: "ONNX export, INT8 quantisation or model file checksums"
- name: "hardware"
  color: "fbca04"
  description: "Jetson or other hardware measurements"
- name: "enhancement"
  color: "a2eeef"
  description: "A proposed feature or option"
- name: "protocol"
  color: "e99695"
  description: "Metrics, splits, thresholds or the evaluation protocol"
- name: "dataset-proposal"
  color: "c2e0c6"
  description: "A proposed dataset"
- name: "model-proposal"
  color: "bfdadc"
  description: "A proposed model, size or band set"
- name: "comparison"
  color: "d4c5f9"
  description: "A comparison with another system or algorithm"
- name: "ci"
  color: "ededed"
  description: "A workflow, job or test failure"
- name: "dependencies"
  color: "0366d6"
  description: "A dependency update or problem"
- name: "licensing"
  color: "f9d0c4"
  description: "Licences of the repository and use of the Tiefer marks"
- name: "governance"
  color: "000000"
  description: "A decision that GOVERNANCE.md gives to the maintainer"
- name: "question"
  color: "d876e3"
  description: "A question the documentation does not answer"
