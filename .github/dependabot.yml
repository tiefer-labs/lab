# Weekly update pull requests for Python dependencies (uv.lock) and actions.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # tacoreader 0.6 and later change the reader; 2.x rejects the
      # tacofoundation: dataset names that CloudSEN12+ uses (docs/DATA.md).
      - dependency-name: "tacoreader"
        versions: [">=0.6"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
