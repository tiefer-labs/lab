# Lint, type check and tests on CPU, each as its own check. Tests use
# synthetic arrays only.
name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Lint and format check
        run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Type check
        run: make typecheck

  # x86 and ARM: Roihu's GPU nodes and the Jetson boards are ARM (aarch64).
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Test
        run: make test

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generator uses the standard library only (Python 3.12 of the runner).
      - name: Software bill of materials
        env:
          PYTHONPATH: src
        run: |
          python3 -m tiefer_lab.sbom --output "$RUNNER_TEMP/sbom.cdx.json"
          {
            echo "### Software bill of materials (CycloneDX 1.5)"
            echo
            echo '<details><summary>sbom.cdx.json</summary>'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/sbom.cdx.json"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      # Pinned with hashes; see the header of .github/ci-tools/requirements.in.
      - name: Install CI tools
        run: |
          uv venv "$RUNNER_TEMP/tools"
          uv pip install --python "$RUNNER_TEMP/tools/bin/python" --require-hashes --only-binary :all: \
            -r .github/ci-tools/requirements.txt

      - name: Shellcheck every script under hpc/ and jetson/
        run: make shellcheck SHELLCHECK="$RUNNER_TEMP/tools/bin/shellcheck"
