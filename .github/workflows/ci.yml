# Lint, type check and tests on CPU, each as its own check. Tests use
# synthetic arrays only.
name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Lint and format check
        run: make lint

  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Type check
        run: make typecheck

  # x86 and ARM: Roihu's GPU nodes and the Jetson boards are ARM (aarch64).
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The x86 job compares the coverage floor with the base commit.
          fetch-depth: ${{ matrix.runner == 'ubuntu-24.04' && 0 || 1 }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Test
        if: matrix.runner != 'ubuntu-24.04'
        run: make test

      # Coverage is measured once, on x86; the floor is fail_under in pyproject.toml.
      - name: Test with coverage
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          uv run --frozen coverage run -m pytest
          total="$(uv run --frozen coverage report --format=total --precision=2 || true)"
          floor="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["coverage"]["report"]["fail_under"])')"
          {
            echo "### Test coverage"
            echo
            echo "Total ${total} percent, floor ${floor} percent (line and branch coverage of src/tiefer_lab)."
            echo
            uv run --frozen coverage report --format=markdown || true
          } >> "$GITHUB_STEP_SUMMARY"
          uv run --frozen coverage report

      - name: Coverage floor never lowered
        if: matrix.runner == 'ubuntu-24.04'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          : > "$RUNNER_TEMP/base-pyproject.toml"
          if [[ -n "${BASE}" ]] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            git show "${BASE}:pyproject.toml" > "$RUNNER_TEMP/base-pyproject.toml" 2>/dev/null || true
          fi
          python3 .github/scripts/coverage_floor.py "$RUNNER_TEMP/base-pyproject.toml" pyproject.toml

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generator uses the standard library only (Python 3.12 of the runner).
      - name: Software bill of materials
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          python3 -m tiefer_lab.sbom --output "$RUNNER_TEMP/sbom.cdx.json" | tee "$RUNNER_TEMP/sbom.txt"
          {
            echo "### Software bill of materials"
            echo
            cat "$RUNNER_TEMP/sbom.txt"
            echo
            echo "Attached to this run as the artifact sbom-cdx."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the SBOM to the run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cdx
          path: ${{ runner.temp }}/sbom.cdx.json
          if-no-files-found: error
          retention-days: 90

  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      # Pinned with hashes; see the header of .github/ci-tools/requirements.in.
      - name: Install CI tools
        run: |
          uv venv "$RUNNER_TEMP/tools"
          uv pip install --python "$RUNNER_TEMP/tools/bin/python" --require-hashes --only-binary :all: \
            -r .github/ci-tools/requirements.txt

      - name: Shellcheck every script under hpc/ and jetson/
        run: make shellcheck SHELLCHECK="$RUNNER_TEMP/tools/bin/shellcheck"

  # The synthetic smoke pipeline end to end: cache, a few training steps,
  # evaluation, ONNX export with the check against PyTorch, INT8, Jetson dry runs.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install locked environment
        run: uv sync --frozen

      - name: Point the TIEFER_* folders at a temporary folder
        run: |
          for name in DATA RUNS REPORTS; do
            mkdir -p "$RUNNER_TEMP/tiefer/${name,,}"
            echo "TIEFER_${name}_DIR=$RUNNER_TEMP/tiefer/${name,,}" >> "$GITHUB_ENV"
          done

      - name: Synthetic smoke pipeline
        run: |
          set -o pipefail
          make smoke SMOKE_SOURCE=synthetic | tee "$RUNNER_TEMP/smoke.log"
          {
            echo "### Synthetic smoke pipeline"
            echo
            echo '```json'
            sed -n '/^{/,/^}/p' "$RUNNER_TEMP/smoke.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Every commit of the history, not only the pushed ones.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz from the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/${archive}" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/${archive}" -C "$RUNNER_TEMP" gitleaks

      - name: Scan every commit for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 . > "$RUNNER_TEMP/gitleaks.log" 2>&1 \
            || status=$?
          cat "$RUNNER_TEMP/gitleaks.log"
          {
            echo "### Secret scan of the full history (gitleaks ${GITLEAKS_VERSION})"
            echo
            grep -E "commits scanned|leaks found" "$RUNNER_TEMP/gitleaks.log" | sed 's/\x1b\[[0-9;]*m//g' || true
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"
